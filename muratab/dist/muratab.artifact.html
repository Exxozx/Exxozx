
  <title>Muratab</title>
  <meta name="claude:viewport-fit-sides" content="cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" />
  <style>
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --surface-2: #f0f2ef;
  --text: #17201d;
  --muted: #5d6a65;
  --border: #dfe4e1;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --accent-soft: #e0f2ef;
  --red: #b42318;      --red-soft: #fde8e6;
  --amber: #a15c07;    --amber-soft: #fdf1dc;
  --green: #18794e;    --green-soft: #e3f4ea;
  --blue: #1d5fbf;     --blue-soft: #e5eefb;
  --grey-soft: #eceeed;
  --shadow: 0 1px 2px rgba(16, 24, 20, .06), 0 4px 16px rgba(16, 24, 20, .05);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --arabic: "Noto Kufi Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --gutter: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171d1b; --surface-2: #1e2623; --text: #e6ece9; --muted: #95a39d;
    --border: #2a3430; --accent: #2bb3a6; --accent-ink: #04201d; --accent-soft: #123a36;
    --red: #f97066; --red-soft: #3a1714; --amber: #f5b14c; --amber-soft: #3a2a10;
    --green: #47cd89; --green-soft: #12301f; --blue: #79a8f2; --blue-soft: #15243d; --grey-soft: #242c29;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171d1b; --surface-2: #1e2623; --text: #e6ece9; --muted: #95a39d;
  --border: #2a3430; --accent: #2bb3a6; --accent-ink: #04201d; --accent-soft: #123a36;
  --red: #f97066; --red-soft: #3a1714; --amber: #f5b14c; --amber-soft: #3a2a10;
  --green: #47cd89; --green-soft: #12301f; --blue: #79a8f2; --blue-soft: #15243d; --grey-soft: #242c29;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font);
}
h1, h2, h3 { margin: 0; line-height: 1.25; font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.wordmark { font-family: var(--display); font-size: 16px; letter-spacing: -0.01em; display: inline-flex; gap: 6px; align-items: baseline; }
.wordmark .ar { font-family: var(--arabic); font-size: 13px; color: var(--accent); font-weight: 700; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; gap: 10px; align-items: center; margin-inline-end: auto; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
  background-image: linear-gradient(var(--accent-ink), var(--accent-ink)), linear-gradient(var(--accent-ink), var(--accent-ink)), linear-gradient(var(--accent-ink), var(--accent-ink));
  background-size: 16px 3px, 16px 3px, 10px 3px; background-position: 7px 8px, 7px 14px, 7px 20px; background-repeat: no-repeat; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
.tabs button:hover { background: var(--surface-2); color: var(--text); }
.tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.branch-picker { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

/* ---------- layout ---------- */
main {
  max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; padding-block: 24px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
main > * { min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-body { padding: 16px; }
.kpi { padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert .value { color: var(--red); }
.kpi.warn .value { color: var(--amber); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
.cover-bar { width: 90px; height: 6px; border-radius: 4px; background: var(--grey-soft); overflow: hidden; display: inline-block; vertical-align: middle; }
.cover-bar > i { display: block; height: 100%; border-radius: 4px; }

/* ---------- chips & buttons ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-out, .s-critical, .s-rejected { background: var(--red-soft); color: var(--red); }
.s-low, .s-requested, .s-draft { background: var(--amber-soft); color: var(--amber); }
.s-ok, .s-received, .s-trusted { background: var(--green-soft); color: var(--green); }
.s-excess, .s-in_transit, .s-sent { background: var(--blue-soft); color: var(--blue); }
.s-idle, .s-cancelled, .s-untrusted { background: var(--grey-soft); color: var(--muted); }

.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 7px 12px; border-radius: 8px; font: inherit; font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
input:focus, select:focus, .btn:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font: inherit; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---------- lists ---------- */
.list { display: grid; }
.list-item { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.list-item:last-child { border-bottom: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.route { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.route .arrow { color: var(--muted); }

/* ---------- POS ---------- */
.menu-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.dish { text-align: start; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 12px; cursor: pointer; font: inherit; color: inherit; display: grid; gap: 4px; }
.dish:hover:not(:disabled) { border-color: var(--accent); }
.dish:disabled { opacity: .5; cursor: not-allowed; }
.dish .price { font-weight: 650; }
.dish .avail { font-size: 12px; color: var(--muted); }
.dish .avail.lowp { color: var(--amber); }
.cart-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }

/* ---------- ledger ---------- */
.chain { display: grid; gap: 0; }
.block { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.block:last-child { border-bottom: 0; }
.block-index { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.block .hashes { display: grid; gap: 2px; margin-top: 4px; color: var(--muted); word-break: break-all; }
.verify { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 10px; }
.verify.ok { background: var(--green-soft); color: var(--green); }
.verify.bad { background: var(--red-soft); color: var(--red); }

/* ---------- branch cards ---------- */
.branch-card { padding: 16px; display: grid; gap: 12px; }
.branch-card .bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--grey-soft); gap: 2px; }
.branch-card .bar i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: 5px; background: var(--c); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12px; color: var(--muted); }
.stats b { display: block; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------- modal & toast ---------- */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); width: min(520px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10, 15, 13, .45); }
dialog form { display: grid; gap: 14px; padding: 20px; }
dialog label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; transition: .2s; max-width: calc(100vw - 32px); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--red); color: #fff; }

@media (max-width: 720px) {
  :root { --gutter: 16px; }
  main { padding-block: 16px; }
  .cols-2, .cols-3 { grid-template-columns: 1fr; }
  .brand { margin-inline-end: 0; flex: 1; }
  .tabs { order: 3; width: 100%; }
  .hide-sm { display: none; }
}

/* ---------- live prices ---------- */
.live-pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live-pill.on { color: var(--green); }
.live-pill.on .dot { background: var(--green); animation: pulse 1.6s infinite; }
.live-pill.err { color: var(--red); }
.live-pill.err .dot { background: var(--red); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.spark { width: 120px; height: 28px; display: block; }
.spark polyline { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.up { color: var(--red); }      /* price up = cost up = bad for a restaurant */
.down { color: var(--green); }
.flat { color: var(--muted); }
.spark.up polyline { stroke: var(--red); } .spark.down polyline { stroke: var(--green); } .spark.flat polyline { stroke: var(--muted); }
td.flash-up { animation: flashUp 1.2s ease-out; }
td.flash-down { animation: flashDown 1.2s ease-out; }
@keyframes flashUp { from { background: var(--red-soft); } to { background: transparent; } }
@keyframes flashDown { from { background: var(--green-soft); } to { background: transparent; } }
.quotes { display: flex; gap: 4px; flex-wrap: wrap; }
.quote { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); white-space: nowrap; }
.quote.best { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.quote.untrusted { text-decoration: line-through; opacity: .6; }
.meter { width: 100px; height: 6px; border-radius: 4px; background: var(--grey-soft); overflow: hidden; display: inline-block; vertical-align: middle; margin-inline-end: 6px; }
.meter > i { display: block; height: 100%; }

/* ---------- setup / editing ---------- */
.edit-rows { display: grid; gap: 6px; }
.edit-row { display: grid; gap: 6px; align-items: center; grid-template-columns: minmax(0, 2fr) minmax(70px, 1fr) 32px; }
.edit-row.cat { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(60px, 1fr)) 32px; }
.edit-row .btn { padding: 4px 0; }
.edit-head { font-size: 11px; color: var(--muted); }
dialog.wide { width: min(720px, calc(100vw - 32px)); }
dialog form { max-height: calc(100vh - 64px); overflow-y: auto; }
.check { display: flex !important; flex-direction: row; gap: 8px; align-items: center; font-size: 13px !important; color: var(--text) !important; }
.danger-zone { border-color: color-mix(in srgb, var(--red) 35%, var(--border)); }
@media (max-width: 720px) {
  .edit-row.cat { grid-template-columns: 1fr 1fr 32px; }
  .edit-row.cat > :first-child { grid-column: 1 / -1; }
  .live-pill { order: 2; }
}

/* ---------- languages: Arabic type and right-to-left ---------- */
:root[lang="ar"] { --font: "Noto Sans Arabic", "Inter", system-ui, sans-serif; --display: "Noto Kufi Arabic", "Noto Sans Arabic", system-ui, sans-serif; }
:root[lang="ar"] h1, :root[lang="ar"] h2, :root[lang="ar"] h3 { letter-spacing: 0; }
[dir="rtl"] .route .arrow, [dir="rtl"] .flip { display: inline-block; transform: scaleX(-1); }
.lang-toggle, .seg button[lang="ar"] { font-family: var(--arabic); }
:root[lang="ar"] .lang-toggle { font-family: var(--font); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- accent colours (light, then dark) ---------- */
:root[data-accent="saffron"] { --accent: #b45309; --accent-soft: #fdf0dc; --accent-ink: #ffffff; }
:root[data-accent="indigo"] { --accent: #4338ca; --accent-soft: #e8e7fb; --accent-ink: #ffffff; }
:root[data-accent="rose"] { --accent: #be123c; --accent-soft: #fde6eb; --accent-ink: #ffffff; }
:root[data-accent="olive"] { --accent: #4d7c0f; --accent-soft: #ecf4dc; --accent-ink: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="saffron"]:not([data-theme="light"]) { --accent: #f2a43a; --accent-soft: #3b2a12; --accent-ink: #231503; }
  :root[data-accent="indigo"]:not([data-theme="light"]) { --accent: #a5a8fb; --accent-soft: #24244a; --accent-ink: #12123a; }
  :root[data-accent="rose"]:not([data-theme="light"]) { --accent: #fb7f9a; --accent-soft: #3e1820; --accent-ink: #2a0610; }
  :root[data-accent="olive"]:not([data-theme="light"]) { --accent: #a3d05a; --accent-soft: #24301a; --accent-ink: #172206; }
}
:root[data-accent="saffron"][data-theme="dark"] { --accent: #f2a43a; --accent-soft: #3b2a12; --accent-ink: #231503; }
:root[data-accent="indigo"][data-theme="dark"] { --accent: #a5a8fb; --accent-soft: #24244a; --accent-ink: #12123a; }
:root[data-accent="rose"][data-theme="dark"] { --accent: #fb7f9a; --accent-soft: #3e1820; --accent-ink: #2a0610; }
:root[data-accent="olive"][data-theme="dark"] { --accent: #a3d05a; --accent-soft: #24301a; --accent-ink: #172206; }

/* ---------- shared bits ---------- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
:root[lang="ar"] .eyebrow { letter-spacing: 0; }
.sub { display: block; font-size: 12px; }
.bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--grey-soft); gap: 2px; }
.bar i { display: block; height: 100%; }
.big { font-family: var(--display); font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.big span { font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--muted); }
.callout { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.form-grid label, .wizard-panel label, .cart label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.form-grid input, .wizard-panel input, .wizard-panel select, .cart input, .cart select { width: 100%; min-width: 0; }
.payload { max-height: 50vh; overflow: auto; background: var(--surface-2); padding: 12px; border-radius: 8px; margin: 0; white-space: pre; direction: ltr; text-align: left; }
code.copyable { display: block; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; word-break: break-all; direction: ltr; text-align: left; user-select: all; }
.s-accepted, .s-preparing { background: var(--blue-soft); color: var(--blue); }
.s-ready, .s-completed { background: var(--green-soft); color: var(--green); }
.s-simulated { background: var(--grey-soft); color: var(--muted); }
.s-pending { background: var(--amber-soft); color: var(--amber); }
.s-error { background: var(--red-soft); color: var(--red); }

/* ---------- preferences ---------- */
.prefs { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; }
.pref { display: grid; gap: 6px; }
.swatches { display: flex; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); background: var(--sw); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--text); }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 24px; padding: 24px; overflow: hidden;
  background: linear-gradient(135deg, var(--accent-soft), var(--surface) 60%); }
.hero h1 { font-size: clamp(24px, 3.2vw, 34px); margin: 6px 0 4px; }
.hero-main { display: grid; gap: 14px; align-content: start; }
.hero-sub { margin: 0; color: var(--muted); font-size: 15px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hero-stats > div { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; }
.hero-stats b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.hero-stats span { font-size: 12px; color: var(--muted); }
.hero-side { display: grid; gap: 18px; align-content: start; border-inline-start: 1px solid var(--border); padding-inline-start: 24px; }
.manager { display: flex; gap: 12px; align-items: center; }
.avatar { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 20px var(--display); flex: none; }
.profile-grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.locs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.loc { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
.loc-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 8px; align-items: center; font-size: 13px; }
.rank .meter { width: 90px; margin: 0; }

/* ---------- wizard ---------- */
body.setup-mode .tabs, body.setup-mode .branch-picker, body.setup-mode .live-pill { display: none; }
.wizard { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; align-items: start; }
.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps button { width: 100%; display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font: inherit; color: var(--muted); text-align: start; cursor: pointer; }
.steps button .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--grey-soft); flex: none; }
.steps button.done .n { background: var(--green-soft); color: var(--green); }
.steps button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.steps button.on .n { background: var(--accent); color: var(--accent-ink); }
.steps button:disabled { opacity: .5; cursor: default; }
.wizard-panel h1 { font-size: 22px; }
.wizard-foot { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
.welcome-hero { display: grid; gap: 8px; justify-items: start; padding: 4px 0 8px; }
.welcome-hero h1 { font-size: clamp(26px, 4vw, 36px); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.welcome-hero .ar { font-family: var(--arabic); color: var(--accent); font-size: .8em; }
.welcome-hero p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 15px; }
.logo.xl { width: 56px; height: 56px; border-radius: 14px; background-size: 30px 5px, 30px 5px, 18px 5px; background-position: 13px 15px, 13px 25px, 13px 35px; }
.choice-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.choice { display: flex !important; gap: 10px; align-items: start; padding: 14px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; color: var(--muted) !important; font-size: 13px !important; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { width: auto !important; margin-top: 3px; }
.choice strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.loc-card .card-head h3 { font-size: 15px; }
.edit-row.tbl { grid-template-columns: minmax(70px, 1fr) 80px minmax(90px, 1.4fr) 32px; }
.edit-row.tbl.edit-head span { font-size: 11px; }
.quick-add { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.quick-add input { width: 76px !important; }
.grid-edit td { padding: 6px; }
.grid-edit input, .grid-edit select { width: 100%; min-width: 90px; }
.grid-edit input.w-s { min-width: 70px; max-width: 110px; }
.quotes button.quote { border: 1px dashed var(--border); cursor: pointer; font: inherit; font-size: 12px; color: var(--text); }
.dish-line { display: flex; gap: 10px; align-items: start; min-width: 0; }
.star { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--border); cursor: pointer; padding: 2px; }
.star.on { color: #e3a008; }
.tick { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--amber-soft); color: var(--amber); flex: none; }
.tick.ok { background: var(--green-soft); color: var(--green); }
.channel-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.switch { display: inline-flex !important; gap: 6px; align-items: center; flex-direction: row !important; font-size: 13px !important; color: var(--text) !important; }
.switch input { width: auto !important; }

/* ---------- orders ---------- */
.pos { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
.cart { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.cart-total { display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--border); }
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; align-items: start; }
.col { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 10px; min-height: 160px; align-content: start; }
.col h3 { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.col .count { background: var(--surface); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.col-received h3 { color: var(--amber); }
.col-ready h3 { color: var(--green); }
.ticket { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.ticket.late { border-color: color-mix(in srgb, var(--red) 55%, var(--border)); }
.ticket header { display: flex; gap: 8px; align-items: center; }
.ticket header .age { margin-inline-start: auto; font-size: 12px; }
.ticket ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.ticket .note { margin: 0; font-size: 12px; padding: 6px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); }
.ticket footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.who { font-size: 13px; }
.ch { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--grey-soft); color: var(--muted); }
.ch-talabat { background: #ff5a0021; color: #c2410c; }
.ch-deliveroo { background: #00ccbc24; color: #0f766e; }
.ch-careem { background: #1aa25724; color: #15803d; }
.ch-dine_in, .ch-takeaway { background: var(--accent-soft); color: var(--accent); }
.tables-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.table-tile { display: grid; gap: 2px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--green-soft); color: var(--green); font: inherit; cursor: pointer; text-align: start; }
.table-tile strong { font-family: var(--display); font-size: 18px; }
.table-tile span { font-size: 12px; }
.table-tile.busy { background: var(--amber-soft); color: var(--amber); }
.table-tile:hover { border-color: currentColor; }

@media (max-width: 960px) {
  .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wizard { grid-template-columns: 1fr; }
  .steps { position: static; overflow-x: auto; }
  .steps ol { display: flex; }
  .steps button { white-space: nowrap; }
  .pos { grid-template-columns: 1fr; }
  .cart { position: static; }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; padding: 16px; }
  .hero-side { border-inline-start: 0; padding-inline-start: 0; border-top: 1px solid var(--border); padding-top: 16px; }
  .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .profile-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
}

 * English, so a missing translation never breaks the screen. To add a language, add a
 * dictionary to I18N and its name to LANGUAGE_NAMES.
 */
const LANGUAGE_NAMES = { en: 'English', ar: 'العربية' };
const I18N = { en: {}, ar: {} }; // the Arabic dictionary is filled in by i18n-ar.js
let currentLang = 'en';

function t(key, vars) {
  let s = (I18N[currentLang] && I18N[currentLang][key]) || key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m));
  return s;
}

const ACCENT_SWATCHES = {
  teal: { name: 'Teal', color: '#0f766e' },
  saffron: { name: 'Saffron', color: '#b45309' },
  indigo: { name: 'Indigo', color: '#4338ca' },
  rose: { name: 'Rose', color: '#be123c' },
  olive: { name: 'Olive', color: '#4d7c0f' },
};

// The page host may already set a theme on <html>; "System" hands control back to it.
const HOST_THEME = document.documentElement.getAttribute('data-theme');
const PREFS_CACHE = 'muratab.prefs';

function applyPrefs(prefs = {}) {
  const root = document.documentElement;
  const p = { theme: 'system', accent: 'teal', language: 'en', ...prefs };
  if (p.theme === 'system') {
    if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME);
    else root.removeAttribute('data-theme');
  } else {
    root.setAttribute('data-theme', p.theme);
  }
  root.setAttribute('data-accent', p.accent);
  currentLang = I18N[p.language] ? p.language : 'en';
  root.lang = currentLang;
  root.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  try { localStorage.setItem(PREFS_CACHE, JSON.stringify(p)); } catch {}
  return p;
}

/** Apply the last-used look straight away so the page doesn't flash before data loads. */
function applyCachedPrefs() {
  try { return applyPrefs(JSON.parse(localStorage.getItem(PREFS_CACHE) || '{}')); } catch { return applyPrefs({}); }
}

  <script>
'use strict';
/*
 * Muratab web client – vanilla JS, no build step.
 * Talks to the HTTP server, or, in the standalone prototype build, straight to the
 * same back end running inside the page (window.MuratabLocal).
 */
const LOCAL = window.MuratabLocal || null;

const state = {
  view: 'dashboard',
  branchId: null,
  branches: [],
  ingredients: [],
  menu: [],
  meta: {},
  cart: {},
  invFilter: 'all',
  invSearch: '',
  prices: null,
  prevPrices: {},
  priceSearch: '',
  priceCat: 'all',
  setupTab: 'menu',
};

// ---------- helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 1) => (n == null ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: d }));
const price = (n) => (n == null ? '—' : `${state.meta.currency || ''} ${Number(n).toFixed(2)}`);
const money = (n) => `${state.meta.currency || ''} ${Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
const when = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');
const branchName = (id) => (id === 'HQ' ? 'HQ' : state.branches.find((b) => b.id === id)?.name || id);
const ingName = (id) => state.ingredients.find((i) => i.id === id)?.name || id;
const ingUnit = (id) => state.ingredients.find((i) => i.id === id)?.unit || '';
const STATUS_LABEL = { out: 'Out of stock', critical: 'Critical', low: 'Low', ok: 'Healthy', excess: 'Excess', idle: 'No usage',
  requested: 'Requested', in_transit: 'In transit', received: 'Received', rejected: 'Rejected', cancelled: 'Cancelled', draft: 'Draft', sent: 'Sent',
  accepted: 'Accepted', preparing: 'Preparing', ready: 'Ready', completed: 'Completed', simulated: 'Simulated', pending: 'Sending', error: 'Failed' };
const chip = (s, label) => `<span class="chip s-${esc(s)}">${esc(t(label || STATUS_LABEL[s] || s))}</span>`;
const linesText = (lines) => lines.map((l) => `${num(l.qty, 2)} ${ingUnit(l.ingredientId)} ${ingName(l.ingredientId)}`).join(', ');

async function api(method, path, body) {
  let status;
  let data;
  if (LOCAL) {
    ({ status, data } = await LOCAL.request(method, path, body));
  } else {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    status = res.status;
    data = await res.json().catch(() => ({}));
  }
  if (status >= 400) {
    let msg = data.error || `Request failed (${status})`;
    if (data.shortages) msg += ': ' + data.shortages.map((s) => `${ingName(s.ingredientId)} needs ${num(s.needed, 2)}, has ${num(s.available, 2)}`).join('; ');
    throw new Error(msg);
  }
  return data;
}

let toastTimer;
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = `toast show${isError ? ' error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = 'toast'), isError ? 5000 : 2600);
}

/** Run an action, toast the result, re-render. */
async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) toast(okMsg);
  } catch (e) {
    toast(e.message, true);
  }
  render();
}

/**
 * Open a form dialog. `onSubmit(data, form)` may throw to keep the dialog open.
 * Row editors: an element with [data-rows="name"] holds rows; a button with
 * [data-add-row="name"] appends ROW_TEMPLATES[name](); [data-del-row] removes its row.
 */
const ROW_TEMPLATES = {};
function modal(html, onSubmit, { wide = false } = {}) {
  const dlg = $('#modal');
  const form = $('#modalForm');
  dlg.classList.toggle('wide', wide);
  form.innerHTML = html;
  form.onclick = (ev) => {
    const add = ev.target.closest('[data-add-row]');
    const del = ev.target.closest('[data-del-row]');
    if (add) {
      ev.preventDefault();
      form.querySelector(`[data-rows="${add.dataset.addRow}"]`).insertAdjacentHTML('beforeend', ROW_TEMPLATES[add.dataset.addRow]());
    } else if (del) {
      ev.preventDefault();
      del.closest('.edit-row').remove();
    }
  };
  form.onsubmit = async (ev) => {
    if (ev.submitter?.value === 'cancel') return;
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    try {
      await onSubmit(data, form);
      dlg.close();
      render();
    } catch (e) {
      toast(e.message, true);
    }
  };
  dlg.showModal();
}

/** Read every .edit-row inside [data-rows=name] as an object of its named fields. */
const readRows = (form, name) =>
  [...form.querySelectorAll(`[data-rows="${name}"] .edit-row`)].map((row) =>
    Object.fromEntries([...row.querySelectorAll('[data-f]')].map((el) => [el.dataset.f, el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value]))
  );

function confirmDialog(title, body, okLabel, onOk) {
  modal(`<h2>${esc(title)}</h2><p style="margin:0">${body}</p>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary">${esc(okLabel)}</button></div>`, onOk);
}

const modalFoot = (label) => `<div class="foot"><button class="btn" value="cancel" formnovalidate>${t('Cancel')}</button><button class="btn primary">${t(label)}</button></div>`;

const otherBranchOptions = (selected) =>
  state.branches.filter((b) => b.id !== state.branchId).map((b) => `<option value="${b.id}" ${b.id === selected ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
const ingredientOptions = (ids, selected) =>
  state.ingredients.filter((i) => !ids || ids.includes(i.id)).map((i) => `<option value="${i.id}" ${i.id === selected ? 'selected' : ''}>${esc(i.name)} (${i.unit})</option>`).join('');

// ---------- views ----------
const views = {};

views.dashboard = async () => {
  const [ov, rows] = await Promise.all([api('GET', '/api/overview'), api('GET', `/api/branches/${state.branchId}/inventory`)]);
  const me = ov.branches.find((b) => b.id === state.branchId);
  const attention = rows.filter((r) => ['out', 'critical', 'low'].includes(r.status)).sort((a, b) => (a.daysOfCover ?? 0) - (b.daysOfCover ?? 0));
  const excess = rows.filter((r) => r.status === 'excess');
  const shortCount = me.counts.out + me.counts.critical;

  const suggestionAction = (s) => {
    if (s.fromBranchId === state.branchId)
      return `<button class="btn sm primary" data-sugg="send" data-s='${esc(JSON.stringify(s))}'>${t('Send now')}</button>`;
    if (s.toBranchId === state.branchId)
      return `<button class="btn sm primary" data-sugg="request" data-s='${esc(JSON.stringify(s))}'>${t('Request')}</button>`;
    return `<button class="btn sm" data-switch="${s.toBranchId}">Act as ${esc(branchName(s.toBranchId))}</button>`;
  };

  const seg = (c, n, total) => (n ? `<i style="width:${(n / total) * 100}%;background:${c}" title="${n}"></i>` : '');
  const branchCards = ov.branches.map((b) => {
    const total = Object.values(b.counts).reduce((a, c) => a + c, 0) || 1;
    return `<div class="card branch-card">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div><h3>${esc(b.name)}</h3><span class="muted" style="font-size:12px">${esc(b.location)}</span></div>
        ${b.id === state.branchId ? chip('ok', 'You') : `<button class="btn sm" data-switch="${b.id}">${t('Switch')}</button>`}
      </div>
      <div class="bar">${seg('var(--red)', b.counts.out + b.counts.critical, total)}${seg('var(--amber)', b.counts.low, total)}${seg('var(--green)', b.counts.ok, total)}${seg('var(--blue)', b.counts.excess, total)}${seg('var(--border)', b.counts.idle, total)}</div>
      <div class="legend"><span style="--c:var(--red)">${b.counts.out + b.counts.critical} critical</span><span style="--c:var(--amber)">${b.counts.low} low</span><span style="--c:var(--green)">${b.counts.ok} ok</span><span style="--c:var(--blue)">${b.counts.excess} excess</span></div>
      <div class="stats"><div>${t('Stock value')}<b>${money(b.stockValue)}</b></div><div>${t('Sales 24h')}<b>${money(b.revenue24h)}</b></div><div>${t('Open POs')}<b>${b.openPurchaseOrders}</b></div></div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div><h1>${esc(me.name)} overview</h1><p>${esc(me.location)} · stock levels are forecast from the last 14 days of orders.</p></div>
    <button class="btn primary" id="autoPo" ${attention.length ? '' : 'disabled'}>${t('Auto-order from trusted suppliers')}</button>
  </div>
  <section class="kpis">
    <div class="card kpi ${shortCount ? 'alert' : ''}"><div class="label">${t('Critical / out of stock')}</div><div class="value">${shortCount}</div><div class="sub">${t('runs out before a delivery')}</div></div>
    <div class="card kpi ${me.counts.low ? 'warn' : ''}"><div class="label">${t('Below reorder point')}</div><div class="value">${me.counts.low}</div><div class="sub">${t('order soon')}</div></div>
    <div class="card kpi"><div class="label">${t('Excess items')}</div><div class="value">${me.counts.excess}</div><div class="sub">${t('spoilage risk · can be transferred')}</div></div>
    <div class="card kpi"><div class="label">${t('Stock on hand')}</div><div class="value">${money(me.stockValue)}</div><div class="sub">${t('at best trusted price')}</div></div>
    <div class="card kpi"><div class="label">${t('Sales last 24h')}</div><div class="value">${money(me.revenue24h)}</div><div class="sub">${me.orders24h} orders</div></div>
    <div class="card kpi"><div class="label">${t('Inbound')}</div><div class="value">${me.openPurchaseOrders + me.inboundTransfers}</div><div class="sub">${me.openPurchaseOrders} POs · ${me.inboundTransfers} transfers</div></div>
  </section>

  <section class="grid cols-2">
    <div class="card">
      <div class="card-head"><h2>${t('Needs attention')}</h2><span class="muted">${attention.length} items</span></div>
      <div class="list">${attention.length ? attention.map((r) => `
        <div class="list-item">
          <div><strong>${esc(r.name)}</strong> ${chip(r.status)}
            <span class="sub muted" style="display:block;font-size:12px">${num(r.qty, 2)} ${r.unit} on hand · ${num(r.daysOfCover)} days cover · lead time ${r.leadTimeDays}d${r.incoming ? ` · ${num(r.incoming, 2)} ${r.unit} inbound` : ''}</span></div>
          <div class="num">${r.recommendedOrderQty ? `<strong>+${num(r.recommendedOrderQty, 2)} ${r.unit}</strong><span class="sub muted" style="display:block;font-size:12px">${esc(r.supplier?.name || '')}</span>` : `<span class="muted">${t('covered by inbound')}</span>`}</div>
        </div>`).join('') : `<div class="empty">${t('Everything is above its reorder point.')}</div>`}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h2>${t('Rebalance between branches')}</h2><span class="muted">${t('surplus → shortage')}</span></div>
      <div class="list">${ov.suggestions.length ? ov.suggestions.map((s) => `
        <div class="list-item">
          <div><span class="route">${esc(branchName(s.fromBranchId))}<span class="arrow">→</span>${esc(branchName(s.toBranchId))}</span>
            <span class="muted" style="display:block;font-size:12px">${num(s.qty, 2)} ${s.unit} ${esc(s.name)} · avoids ~${money(s.estimatedSavings)} of purchasing</span></div>
          ${suggestionAction(s)}
        </div>`).join('') : `<div class="empty">${t('No surplus matches a shortage right now.')}</div>`}
      </div>
    </div>
  </section>

  <section>
    <div class="page-head" style="margin-bottom:12px"><h2>${t('Branch network')}</h2>
      <span class="chip ${ov.ledger.valid ? 's-ok' : 's-critical'}">Ledger ${ov.ledger.valid ? 'verified' : 'INVALID'} · ${ov.ledger.blocks} blocks</span></div>
    <div class="grid cols-3">${branchCards}</div>
  </section>
  ${excess.length ? `<p class="muted">Excess here: ${excess.map((r) => `${esc(r.name)} (${num(r.surplusQty, 2)} ${r.unit} above target)`).join(', ')}.</p>` : ''}`;
};

views.dashboard.bind = (root) => {
  $('#autoPo', root)?.addEventListener('click', () =>
    act(async () => {
      const pos = await api('POST', `/api/branches/${state.branchId}/purchase-orders/auto`);
      if (!pos.length) throw new Error('Nothing to order – inbound stock already covers the shortfall');
      state.view = 'suppliers';
      toast(`Created ${pos.length} draft purchase order${pos.length > 1 ? 's' : ''}. Review and send them below.`);
    })
  );
  root.querySelectorAll('[data-sugg]').forEach((btn) =>
    btn.addEventListener('click', () => {
      const s = JSON.parse(btn.dataset.s);
      const lines = [{ ingredientId: s.ingredientId, qty: s.qty }];
      if (btn.dataset.sugg === 'send')
        act(() => api('POST', '/api/transfers/dispatch', { branchId: state.branchId, toBranchId: s.toBranchId, lines, note: 'Rebalancing suggestion' }), t('Transfer dispatched and signed onto the ledger'));
      else
        act(() => api('POST', '/api/transfers/request', { branchId: state.branchId, fromBranchId: s.fromBranchId, lines, note: 'Rebalancing suggestion' }), t('Request signed onto the ledger'));
    })
  );
};

views.inventory = async () => {
  const rows = await api('GET', `/api/branches/${state.branchId}/inventory`);
  const branch = state.branches.find((b) => b.id === state.branchId);
  const f = state.invFilter;
  const q = state.invSearch.toLowerCase();
  const shown = rows.filter((r) =>
    (f === 'all' || (f === 'reorder' && ['out', 'critical', 'low'].includes(r.status)) || (f === 'excess' && r.status === 'excess')) &&
    (!q || r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q))
  );
  const barColor = { out: 'var(--red)', critical: 'var(--red)', low: 'var(--amber)', ok: 'var(--green)', excess: 'var(--blue)', idle: 'var(--border)' };
  const totalValue = rows.reduce((s, r) => s + r.stockValue, 0);

  return `
  <div class="page-head">
    <div><h1>Inventory · ${esc(branch.name)}</h1><p>${rows.length} ingredients · ${money(totalValue)} on hand. Thresholds use supplier lead time + ${branch.settings.safetyDays} safety days, capped by shelf life.</p></div>

views.transfers = async () => {

    if (tx.type === 'GENESIS' || tx.type === 'MEMBER_ADD') return `Registered ${p.members.map((m) => esc(m.name)).join(', ')} as signing members`;

      const last = t.history[t.history.length - 1];
      return `<tr><td><span class="mono">${esc(t.id)}</span>${t.note ? `<span class="sub">${esc(t.note)}</span>` : ''}</td>

        <td>${when(last.at)}<span class="sub">block #${last.block} · signed by ${esc(branchName(last.by))}</span></td>

    }).join('') || `<tr><td colspan="6" class="empty">${t('No transfers yet.')}</td></tr>`}
    </tbody></table></div></div>

  <div class="card">
    <div class="card-head"><h2>${t('Shared ledger')}</h2><button class="btn sm" id="verifyBtn">${t('Re-verify chain')}</button></div>
    <div class="card-body" style="padding-bottom:0">
      <div class="verify ${verify.valid ? 'ok' : 'bad'}"><strong>${verify.valid ? '✓ Chain valid' : '✗ Chain invalid'}</strong>
        <span>${verify.blocks} blocks · every hash link and Ed25519 signature checked${verify.errors.length ? ' · ' + esc(verify.errors.join('; ')) : ''}</span></div>
    </div>
    <div class="chain">${blocks.map((b) => `

          <span class="muted">signed by ${esc(branchName(b.validator))} · ${when(b.timestamp)}</span></div>
          <div>${txSummary(b.tx)}</div>
          <div class="hashes mono"><span>hash ${esc(b.hash)}</span><span>prev ${esc(b.prevHash)}</span><span>sig ${esc(b.signature.slice(0, 44))}…</span></div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
};

// ---------- live prices ----------
const dirOf = (pct) => (pct > 0.05 ? 'up' : pct < -0.05 ? 'down' : 'flat');
const pctText = (p) => `${p > 0.05 ? '▲' : p < -0.05 ? '▼' : '•'} ${Math.abs(p).toFixed(1)}%`;
const shortName = (n) => { const w = n.split(' '); return w[0].length < 4 && w[1] ? `${w[0]} ${w[1]}` : w[0]; };
function spark(values, cls) {
  if (!values || values.length < 2) return '<span class="muted">—</span>';
  const min = Math.min(...values);
  const span = Math.max(...values) - min || 1;
  const pts = values.map((v, i) => `${((i / (values.length - 1)) * 118 + 1).toFixed(1)},${(27 - ((v - min) / span) * 25).toFixed(1)}`).join(' ');
  return `<svg class="spark ${cls}" viewBox="0 0 120 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

function paintPrices() {
  const snap = state.prices;
  const rowsEl = $('#priceRows');
  if (!snap || !rowsEl) return;
  const st = snap.status;
  const src = st.mode === 'http' ? `feed ${esc(st.url)}`
    : LOCAL ? 'simulated market (the server version can connect a real supplier feed)'
    : 'simulated market (connect a real feed with PRICE_FEED_URL)';
  $('#priceSub').innerHTML = `Source: ${src} · ${st.running ? `updates every ${st.intervalMs / 1000}s` : 'paused'} · last update ${snap.at ? new Date(snap.at).toLocaleTimeString() : '—'}${st.error ? ` · <span class="up">${esc(st.error)}</span>` : ''}`;
  $('#feedToggle').textContent = st.running ? 'Pause feed' : 'Resume feed';

  const ings = snap.ingredients.filter((i) => i.marketPrice != null);
  const sorted = [...ings].sort((a, b) => b.changePct - a.changePct);
  const up = ings.filter((i) => dirOf(i.changePct) === 'up').length;
  const down = ings.filter((i) => dirOf(i.changePct) === 'down').length;
  const avgFc = snap.menu.length ? snap.menu.reduce((s, m) => s + (m.foodCostPct || 0), 0) / snap.menu.length : 0;
  const kpi = (label, value, sub, cls = '') => `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
  $('#priceKpis').innerHTML = sorted.length ? [
    kpi('Biggest increase', pctText(sorted[0].changePct), `${esc(sorted[0].name)} · last ${snap.windowMinutes} min`, dirOf(sorted[0].changePct)),
    kpi('Biggest drop', pctText(sorted.at(-1).changePct), `${esc(sorted.at(-1).name)} · last ${snap.windowMinutes} min`, dirOf(sorted.at(-1).changePct)),
    kpi('Rising / falling', `${up} / ${down}`, `of ${ings.length} priced ingredients`),
    kpi('Avg. food cost', `${avgFc.toFixed(1)}%`, 'of menu price, at live prices', avgFc > 35 ? 'up' : ''),
  ].join('') : '';

  const q = state.priceSearch.toLowerCase();
  const shown = snap.ingredients.filter((i) => (state.priceCat === 'all' || i.category === state.priceCat) && (!q || i.name.toLowerCase().includes(q)));
  rowsEl.innerHTML = shown.map((i) => {
    const prev = state.prevPrices[i.ingredientId];
    const flash = prev != null && i.marketPrice != null && prev !== i.marketPrice ? (i.marketPrice > prev ? 'flash-up' : 'flash-down') : '';
    const d = dirOf(i.changePct);
    return `<tr>
      <td><strong>${esc(i.name)}</strong><span class="sub">${esc(i.category)} · per ${esc(i.unit)}</span></td>
      <td class="num ${flash}"><strong>${price(i.marketPrice)}</strong><span class="sub ${dirOf(i.tickPct)}">${i.marketPrice == null ? 'no supplier' : pctText(i.tickPct) + ' last tick'}</span></td>
      <td>${spark(i.history, d)}</td>
      <td class="num ${d}">${i.marketPrice == null ? '—' : pctText(i.changePct)}</td>
      <td>${i.bestTrusted ? `${price(i.bestTrusted.price)}<span class="sub">${esc(i.bestTrusted.supplierName)}</span>` : `<span class="muted">${t('no trusted supplier')}</span>`}</td>
      <td class="hide-sm"><div class="quotes">${i.quotes.map((x) => `<span class="quote ${x.trusted ? '' : 'untrusted'} ${i.bestTrusted?.supplierId === x.supplierId ? 'best' : ''}" title="List price ${price(x.basePrice)} · ${x.vsListPct > 0 ? '+' : ''}${x.vsListPct}% vs list${x.trusted ? '' : ' · not trusted'}">${esc(shortName(x.supplierName))} ${Number(x.price).toFixed(2)}</span>`).join('')}</div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" class="empty">${t('No ingredients match.')}</td></tr>`;

  $('#menuCostRows').innerHTML = snap.menu.map((m) => {
    const pct = m.foodCostPct ?? 0;
    const color = pct > 40 ? 'var(--red)' : pct > 30 ? 'var(--amber)' : 'var(--green)';
    return `<tr><td><strong>${esc(m.name)}</strong></td><td class="num">${price(m.price)}</td><td class="num">${price(m.foodCost)}</td>
      <td><span class="meter"><i style="width:${Math.min(100, pct)}%;background:${color}"></i></span>${pct.toFixed(1)}%</td>
      <td class="num">${price(m.margin)}</td></tr>`;
  }).join('') || `<tr><td colspan="5" class="empty">${t('No dishes yet – add some in Setup.')}</td></tr>`;
}

views.prices.bind = (root) => {

  <div class="seg" style="overflow-x:auto;max-width:100%;justify-self:start">${tabs.map(([k, l]) => `<button data-stab="${k}" class="${state.setupTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>

views.setup.bind = (root) => {
  $('#openProfile', root)?.addEventListener('click', () => openWizard(1));
  root.querySelectorAll('[data-stab]').forEach((b) => b.addEventListener('click', () => { state.setupTab = b.dataset.stab; render(); }));
  const del = (what, name, url, after) => confirmDialog(`Delete ${what}?`, `<b>${esc(name)}</b> will be removed. This can't be undone (but you can restore the demo data or import a backup).`, 'Delete',
    async () => { await api('DELETE', url); if (after) await after(); toast(`${name} deleted`); });
  const handlers = {
    'add-dish': () => dishForm(),
    'edit-dish': (id) => dishForm(state.menu.find((m) => m.id === id)),
    'del-dish': (id) => del('dish', state.menu.find((m) => m.id === id).name, `/api/menu/${id}`, refreshRefs),
    'add-ing': () => ingredientForm(),
    'edit-ing': (id) => ingredientForm(state.ingredients.find((i) => i.id === id)),
    'del-ing': (id) => del('ingredient', ingName(id), `/api/ingredients/${id}`, refreshRefs),
    'add-sup': () => supplierForm(),
    'edit-sup': (id) => supplierForm(state.suppliers.find((s) => s.id === id)),
    'del-sup': (id) => del('supplier', state.suppliers.find((s) => s.id === id).name, `/api/suppliers/${id}`),
    'add-branch': () => branchForm(),
    'edit-branch': (id) => branchForm(state.branches.find((b) => b.id === id)),
    export: async () => {
      const data = await api('GET', '/api/export');
      const text = JSON.stringify(data, null, 2);
      if (LOCAL) {
        // Downloads can be blocked where the prototype is embedded, so offer the JSON to copy.
        modal(`<h2>${t('Export data')}</h2><p class="muted" style="margin:0">${t('Copy this and save it as a')} <span class="mono">${t('.json')}</span> ${t('file. Use “Paste JSON” or “Import file” to load it back.')}</p>
          <textarea id="exportText" readonly rows="12" class="mono" style="width:100%">${esc(text)}</textarea>
          <div class="foot"><button class="btn" value="cancel" formnovalidate>${t('Close')}</button><button class="btn primary">${t('Copy to clipboard')}</button></div>`,
        async () => {
          const ta = $('#exportText');
          try {
            await navigator.clipboard.writeText(text);
            toast(t('Copied – paste it into a .json file'));
          } catch {
            ta.focus();
            ta.select();
            throw new Error('Copy is blocked here – the text is selected, press Ctrl/Cmd+C');
          }
        }, { wide: true });
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      a.download = `muratab-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    },
    paste: () => modal(`<h2>${t('Paste exported data')}</h2>
      <textarea id="pasteText" name="json" rows="12" class="mono" style="width:100%" placeholder='{"format":"muratab/v1", ...}' required></textarea>
      <p class="muted" style="margin:0">${t('This replaces the current data and starts a fresh ledger for the imported branches.')}</p>
      ${modalFoot('Import')}`,
    async (d) => {
      let json;
      try { json = JSON.parse(d.json); } catch { throw new Error('That is not valid JSON – paste the whole export'); }
      await api('POST', '/api/import', json);
      state.prices = null;
      await refreshRefs();
      toast(t('Data imported'));
    }, { wide: true }),
    blank: () => confirmDialog('Start from a blank template?', 'All current branches, menu, suppliers, stock, orders and ledger history will be replaced with one empty branch. Export first if you want to keep them.', 'Replace with blank',
      async () => {
        await api('POST', '/api/import', { data: { meta: state.meta, branches: [{ id: 'main-branch', name: 'Main branch', location: '' }], ingredients: [], menu: [], suppliers: [] } });
        state.prices = null;
        await refreshRefs();
        state.setupTab = 'ingredients';
        toast(t('Blank template ready – start by adding ingredients'));
      }),
    reset: () => confirmDialog('Restore demo data?', 'Everything will be replaced with the three-branch sample group.', 'Restore demo',
      async () => { await api('POST', '/api/reset'); state.prices = null; await refreshRefs(); toast(t('Demo data restored')); }),
  };
  root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => handlers[b.dataset.act](b.dataset.id)));
  $('#metaForm', root)?.addEventListener('submit', (ev) => {
    ev.preventDefault();
    act(async () => { await api('PATCH', '/api/meta', Object.fromEntries(new FormData(ev.target))); await refreshRefs(); }, t('Details saved'));
  });
  $('#importFile', root)?.addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    act(async () => {
      let json;
      try { json = JSON.parse(await file.text()); } catch { throw new Error('That file is not valid JSON'); }
      await api('POST', '/api/import', json);
      state.prices = null;
      await refreshRefs();
    }, t('Data imported – a fresh ledger was started for the imported branches'));
  });
};

// ---------- shell ----------
async function render() {
  const root = $('#view');
  if (render.busy) return void (render.again = true);
  render.busy = true;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
  document.body.classList.toggle('setup-mode', state.view === 'wizard' && !state.profile?.setupComplete);
  try {
    root.innerHTML = await views[state.view]();
    views[state.view].bind?.(root);
  } catch (e) {
    root.innerHTML = `<div class="card empty">${t('Could not load')}: ${esc(e.message)}</div>`;
  }
  root.querySelectorAll('[data-switch]').forEach((b) => b.addEventListener('click', () => setBranch(b.dataset.switch)));
  render.busy = false;
  if (render.again) {
    render.again = false;
    render();
  }
}

/** Reload reference data after edits in Setup (or an import). */
async function refreshRefs() {
  const [branches, ingredients, menu, ov] = await Promise.all([api('GET', '/api/branches'), api('GET', '/api/ingredients'), api('GET', '/api/menu'), api('GET', '/api/overview')]);
  Object.assign(state, { branches, ingredients, menu, meta: ov.meta });
  $('#chainName').textContent = ov.meta.chainName;
  if (!branches.some((b) => b.id === state.branchId)) state.branchId = branches[0].id;
  const sel = $('#branchSelect');
  sel.innerHTML = branches.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  sel.value = state.branchId;
}

// ---------- live price stream ----------
function updateLivePill() {
  const pill = $('#livePill');
  const st = state.prices?.status;
  const connected = state.streamOpen;
  pill.classList.toggle('on', Boolean(connected && st?.running && !st?.error));
  pill.classList.toggle('err', Boolean(st?.error) || !connected);
  $('#liveText').textContent = t(!connected ? 'Offline' : st?.error ? 'Feed error' : st?.running ? 'Live prices' : 'Prices paused');
}

function onPrices(snap) {
  const prev = {};
  for (const i of state.prices?.ingredients || []) prev[i.ingredientId] = i.marketPrice;
  state.prevPrices = prev;
  state.prices = snap;
  updateLivePill();
  if (state.view === 'prices') paintPrices();
}

function connectPrices() {
  if (LOCAL) {
    state.streamOpen = true;
    LOCAL.subscribe(onPrices);
    return;
  }
  const es = new EventSource('/api/prices/stream');
  es.addEventListener('open', () => { state.streamOpen = true; updateLivePill(); });
  es.addEventListener('prices', (e) => { state.streamOpen = true; onPrices(JSON.parse(e.data)); });
  es.addEventListener('error', () => { state.streamOpen = false; updateLivePill(); });
}

function setBranch(id) {
  state.branchId = id;
  state.cart = {};
  if (state.pos) Object.assign(state.pos, { cart: {}, tableId: '' });
  $('#branchSelect').value = id;
  try { localStorage.setItem('muratab.branch', id); } catch {}
  render();
}

views.wizard = async () => {
  state.profile = await api('GET', '/api/profile');
  state.wizard ||= { step: state.profile.setupComplete ? 1 : state.profile.setupStep || 0, drafts: {} };
  const w = state.wizard;
  const step = WIZARD_STEPS[w.step];
  const first = setupMode();
  const body = await STEP_VIEWS[step.id].render();
  const isLast = w.step === WIZARD_STEPS.length - 1;
  return `<div class="wizard">
    <nav class="steps" aria-label="${t('Setup steps')}"><ol>${WIZARD_STEPS.map((s, i) => `<li>
      <button type="button" data-step="${i}" class="${i === w.step ? 'on' : ''} ${i < (state.profile.setupStep || 0) || !first ? 'done' : ''}" ${first && i > (state.profile.setupStep || 0) ? 'disabled' : ''} ${i === w.step ? 'aria-current="step"' : ''}>
        <span class="n">${i + 1}</span>${t(s.title)}</button></li>`).join('')}</ol></nav>
    <form class="card wizard-panel" id="wizardForm" novalidate>
      <div class="card-head"><div><span class="eyebrow">${t('Step {n} of {total}', { n: w.step + 1, total: WIZARD_STEPS.length })}</span><h1>${t(step.title)}</h1></div>
        ${first ? '' : `<button type="button" class="btn" id="wizHome">${t('Back to home')}</button>`}</div>
      <div class="card-body edit-rows">${body}</div>
      <div class="wizard-foot">
        ${w.step > 0 ? `<button type="button" class="btn" id="wizBack">${t('Back')}</button>` : '<span></span>'}
        <button type="submit" class="btn primary" id="wizNext">${t(isLast ? (first ? 'Finish setup' : 'Done') : first ? 'Save & continue' : 'Save')}</button>
      </div>
    </form></div>`;
};

views.wizard.bind = (root) => {
  const w = state.wizard;
  const step = WIZARD_STEPS[w.step];
  const form = $('#wizardForm', root);
  STEP_VIEWS[step.id].bind?.(form);
  const go = (i) => { w.step = i; window.scrollTo(0, 0); render(); };
  root.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.step))));
  $('#wizBack', root)?.addEventListener('click', () => go(w.step - 1));
  $('#wizHome', root)?.addEventListener('click', () => { state.view = 'home'; render(); });
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = $('#wizNext');
    btn.disabled = true;
    try {
      await STEP_VIEWS[step.id].save(form);
      const first = setupMode();
      const isLast = w.step === WIZARD_STEPS.length - 1;
      if (first && !isLast) await api('PATCH', '/api/profile', { setupStep: Math.max(state.profile.setupStep || 0, w.step + 1) });
      if (isLast) {
        state.wizard = null;
        state.view = 'home';
        toast(first ? t('All set – welcome to Muratab') : t('Saved'));
        render();
      } else if (first) {
        go(w.step + 1);
      } else {
        toast(t('Saved'));
        render();
      }
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
    }
  });
};

  <script>

          : `<div class="row"><label>${t('Customer name')}<input id="posCustomer" value="${esc(pos.customer)}"></label><label>${t('Phone')}<input id="posPhone" type="tel" value="${esc(pos.phone)}"></label></div>`}
          ${cart.map(([id, q]) => `<div class="cart-line"><span>${esc(byId[id].name)}</span>
            <span class="qty"><button type="button" data-dec="${id}" aria-label="${t('Remove one')}">−</button><b>${q}</b><button type="button" data-add="${id}" aria-label="${t('Add one')}" ${q >= byId[id].portions ? 'disabled' : ''}>+</button></span></div>`).join('') || `<div class="empty">${t('Tap a dish to add it.')}</div>`}
          <label>${t('Kitchen note')}<input id="posNotes" value="${esc(pos.notes)}" placeholder="${t('e.g. no onions, allergy…')}"></label>
          <div class="cart-total"><strong>${t('Total')}</strong><strong>${price(total)}</strong></div>
          <div class="actions"><button type="button" class="btn primary" id="placeOrder" ${cart.length ? '' : 'disabled'}>${t('Send to kitchen')}</button><button type="button" class="btn" id="clearCart" ${cart.length ? '' : 'disabled'}>${t('Clear')}</button></div>
        </div></div>
    </section>`;
  },

  async kitchen() {
    const orders = await api('GET', `/api/orders?branchId=${state.branchId}&status=active&limit=200`);
    return `<p class="muted">${t('Orders from every channel in one place. Accepting an order takes its ingredients out of stock; delivery apps are told about every change.')}</p>
    <section class="board">${KITCHEN_COLUMNS.map(([s, l]) => {
      const list = orders.filter((o) => o.status === s).reverse();
      return `<div class="col col-${s}"><h3>${t(l)} <span class="count">${list.length}</span></h3>${list.map(orderCard).join('') || `<div class="empty">${t('Nothing here')}</div>`}</div>`;
    }).join('')}</section>`;
  },

  async tables() {
    const tables = await api('GET', `/api/branches/${state.branchId}/tables`);
    const areas = {};
    for (const x of tables) (areas[x.area] ||= []).push(x);
    return `<p class="muted">${t('{free} of {n} tables free. Tap a free table to start an order for it.', { free: tables.filter((x) => !x.occupied).length, n: tables.length })}</p>
    ${Object.entries(areas).map(([area, list]) => `<h3>${esc(area)}</h3><div class="tables-grid">${list.map((x) => `
      <button type="button" class="table-tile ${x.occupied ? 'busy' : ''}" data-table="${x.id}">
        <strong>${esc(x.label)}</strong><span>${t('{n} seats', { n: x.seats })}</span>
        <span class="state">${x.occupied ? `${price(x.openTotal)} · ${t('{n} min', { n: minutesAgo(x.since) })}` : t('Free')}</span>
      </button>`).join('')}</div>`).join('') || `<div class="card empty">${t('No tables yet.')} ${editLink(2, 'Add tables')}</div>`}`;
  },

  async history() {
    const orders = await api('GET', `/api/orders?branchId=${state.branchId}&limit=60`);
    return `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>#</th><th>${t('Time')}</th><th>${t('Channel')}</th><th>${t('Table / customer')}</th><th>${t('Items')}</th><th class="num">${t('Total')}</th><th>${t('Status')}</th></tr></thead>
      <tbody>${orders.map((o) => `<tr><td class="mono">${o.number ?? '—'}</td><td>${when(o.at)}</td><td>${channelName(o.channel || 'dine_in')}</td><td>${orderWho(o)}</td>
        <td>${esc(o.items.map((i) => `${i.qty}× ${i.name || state.menu.find((m) => m.id === i.menuItemId)?.name || i.menuItemId}`).join(', '))}</td>
        <td class="num">${price(o.total)}</td><td>${chip(o.status || 'completed')}${o.rejectReason ? `<span class="sub muted">${esc(o.rejectReason)}</span>` : ''}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
  },

  async apps() {
    const [{ list, config }, log] = await Promise.all([api('GET', '/api/channels'), api('GET', '/api/integrations/log')]);
    state.integrationLog = log;
    const ext = list.filter((c) => c.kind !== 'internal');
    return `<div class="callout">${LOCAL
      ? t('This prototype simulates the delivery apps: “Simulate order” creates a realistic platform order and sends it through the same webhook code a real platform would call. Status updates back to the app are recorded below instead of being sent.')
      : t('Platforms send orders to the webhook shown in Setup → Ordering channels. Status updates are sent for real when the platform’s API URL and token are set on the server (for example TALABAT_API_URL and TALABAT_API_TOKEN); otherwise they are recorded below as simulated.')}</div>
    <div class="channel-grid">${ext.map((c) => {
      const cfg = config[c.id] || {};
      const store = cfg.storeIds?.[state.branchId];
      return `<div class="card channel-card"><div class="card-head"><h3>${esc(channelName(c.id))}</h3>${chip(cfg.enabled ? 'ok' : 'idle', cfg.enabled ? 'On' : 'Off')}</div>
        <div class="card-body edit-rows"><span class="sub muted">${esc(c.platform)}</span>
          <span>${store ? `${t('Store ID')}: <span class="mono">${esc(store)}</span>` : `<span class="muted">${t('No store ID for {b}', { b: esc(branchName(state.branchId)) })}</span>`}</span>
          <span class="sub muted">${cfg.autoAccept ? t('Accepts orders automatically') : t('Orders wait for you to accept')}</span>
          <div class="actions">
            <button type="button" class="btn sm primary" data-sim="${c.id}" ${cfg.enabled && store ? '' : 'disabled'}>${t('Simulate order')}</button>
            <button type="button" class="btn sm" data-menu-sync="${c.id}" ${cfg.enabled ? '' : 'disabled'}>${t('Send menu')}</button>
            ${editLink(6, 'Settings')}
          </div></div></div>`;
    }).join('')}</div>
    <div class="card"><div class="card-head"><h2>${t('Activity with delivery apps')}</h2><span class="muted">${t('latest first')}</span></div>
      <div class="table-wrap"><table><thead><tr><th>${t('Time')}</th><th></th><th>${t('App')}</th><th>${t('Event')}</th><th>${t('Details')}</th><th>${t('Status')}</th><th></th></tr></thead>
      <tbody>${log.map((e, i) => `<tr><td>${when(e.at)}</td><td title="${t(e.direction === 'in' ? 'Received from the app' : 'Sent to the app')}">${e.direction === 'in' ? '↓' : '↑'}</td>
        <td>${channelName(e.channel)}</td><td>${esc(t(e.event || ''))}</td><td>${esc(e.summary || e.error || '')}</td><td>${chip(e.status)}</td>
        <td>${e.request ? `<button type="button" class="btn sm" data-payload="${i}">${t('View data')}</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">${t('No activity yet.')}</td></tr>`}</tbody></table></div></div>`;
  },
};

views.orders = async () => {
  const tab = state.ordersTab;
  return `<div class="page-head"><div><h1>${t('Orders')} · ${esc(branchName(state.branchId))}</h1></div>
    <div class="seg">${ORDER_TABS.map(([k, l]) => `<button type="button" data-otab="${k}" class="${tab === k ? 'on' : ''}">${t(l)}</button>`).join('')}</div></div>
    ${await orderPanels[tab]()}`;
};

views.orders.bind = (root) => {
  const pos = state.pos;
  root.querySelectorAll('[data-otab]').forEach((b) => b.addEventListener('click', () => { state.ordersTab = b.dataset.otab; render(); }));
  root.querySelectorAll('[data-edit-step]').forEach((b) => b.addEventListener('click', () => openWizard(Number(b.dataset.editStep))));
  const keepFields = () => {
    pos.tableId = $('#posTable')?.value ?? pos.tableId;
    pos.customer = $('#posCustomer')?.value ?? pos.customer;
    pos.phone = $('#posPhone')?.value ?? pos.phone;
    pos.notes = $('#posNotes')?.value ?? pos.notes;
  };
  root.querySelectorAll('[data-pos-ch]').forEach((b) => b.addEventListener('click', () => { keepFields(); pos.channel = b.dataset.posCh; render(); }));
  root.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => { keepFields(); pos.cart[b.dataset.add] = (pos.cart[b.dataset.add] || 0) + 1; render(); }));
  root.querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', () => { keepFields(); pos.cart[b.dataset.dec] = Math.max(0, (pos.cart[b.dataset.dec] || 0) - 1); render(); }));
  $('#clearCart', root)?.addEventListener('click', () => { pos.cart = {}; pos.notes = ''; render(); });
  $('#placeOrder', root)?.addEventListener('click', () => act(async () => {
    keepFields();
    const items = Object.entries(pos.cart).filter(([, q]) => q > 0).map(([menuItemId, qty]) => ({ menuItemId, qty }));
    const o = await api('POST', `/api/branches/${state.branchId}/orders`, {
      items, channel: pos.channel, tableId: pos.channel === 'dine_in' ? pos.tableId || undefined : undefined,
      customer: pos.channel === 'takeaway' ? { name: pos.customer, phone: pos.phone } : undefined, notes: pos.notes,
    });
    Object.assign(pos, { cart: {}, notes: '', customer: '', phone: '', tableId: '' });
    toast(t('Order #{n} sent to the kitchen', { n: o.number }));
  }));
  root.querySelectorAll('[data-act-order]').forEach((b) => b.addEventListener('click', () => {
    const { actOrder: action, id } = b.dataset;
    if (action === 'reject' || action === 'cancel') {
      return modal(`<h2>${t(action === 'reject' ? 'Reject order' : 'Cancel order')}</h2>
        <label>${t('Reason (sent to the delivery app)')}<select name="reason">
          ${['ITEM_UNAVAILABLE', 'TOO_BUSY', 'CLOSED', 'ADDRESS_INCOMPLETE', 'OTHER'].map((r) => `<option value="${r}">${t(r)}</option>`).join('')}</select></label>
        ${modalFoot(action === 'reject' ? 'Reject order' : 'Cancel order')}`,
      (d) => api('POST', `/api/orders/${id}/${action}`, { reason: d.reason }).then(() => toast(t('Order updated'))));
    }
    act(() => api('POST', `/api/orders/${id}/${action}`), t('Order updated'));
  }));
  root.querySelectorAll('[data-table]').forEach((b) => b.addEventListener('click', () => {
    state.pos.channel = 'dine_in';
    state.pos.tableId = b.dataset.table;
    state.ordersTab = b.classList.contains('busy') ? 'kitchen' : 'new';
    render();
  }));
  root.querySelectorAll('[data-sim]').forEach((b) => b.addEventListener('click', () => act(async () => {
    const r = await api('POST', `/api/integrations/${b.dataset.sim}/simulate`, { branchId: state.branchId });
    toast(t('{app} order #{n} received – {status}', { app: channelName(b.dataset.sim), n: r.order.number, status: t(STATUS_LABEL[r.order.status]) }));
  })));
  root.querySelectorAll('[data-menu-sync]').forEach((b) => b.addEventListener('click', () => act(() => api('POST', `/api/integrations/${b.dataset.menuSync}/menu`), t('Menu sent'))));
  root.querySelectorAll('[data-payload]').forEach((b) => b.addEventListener('click', () => {
    const e = state.integrationLog[Number(b.dataset.payload)];
    modal(`<h2>${channelName(e.channel)} · ${esc(t(e.event))}</h2>
      ${e.request?.path ? `<div class="mono">${esc(e.request.method)} ${esc(e.request.path)}</div>` : ''}
      <pre class="payload mono">${esc(JSON.stringify(e.request?.body ?? e.request, null, 2))}</pre>
      ${e.response ? `<div class="edit-head">${t('Response')}</div><pre class="payload mono">${esc(JSON.stringify(e.response, null, 2))}</pre>` : ''}
      <div class="foot"><button class="btn" value="cancel" formnovalidate>${t('Close')}</button></div>`, async () => {}, { wide: true });
  }));
};

// Keep the kitchen board, tables and app activity fresh while they are on screen.
setInterval(() => {
  if (document.hidden || $('#modal').open || state.view !== 'orders' || !['kitchen', 'tables', 'apps'].includes(state.ordersTab)) return;
  render();
}, 5000);
</script>
  <script>
'use strict';
/* Start-up: load the restaurant, apply its look and language, and open the setup wizard on the first visit. */

async function init() {
  state.prefs = applyCachedPrefs();
  const [branches, ingredients, menu, ov, profile] = await Promise.all([
    api('GET', '/api/branches'), api('GET', '/api/ingredients'), api('GET', '/api/menu'), api('GET', '/api/overview'), api('GET', '/api/profile'),
  ]);
  Object.assign(state, { branches, ingredients, menu, meta: ov.meta, profile });
  state.prefs = applyPrefs(profile.preferences);
  $('#chainName').textContent = ov.meta.chainName || t('Inventory & supply network');

  let saved = null;
  try { saved = localStorage.getItem('muratab.branch'); } catch {}
  state.branchId = branches.some((b) => b.id === saved) ? saved : branches[0].id;
  const sel = $('#branchSelect');
  sel.innerHTML = branches.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  sel.value = state.branchId;
  sel.addEventListener('change', () => setBranch(sel.value));

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
  $('#livePill').addEventListener('click', () => { state.view = 'prices'; render(); });
  $('#langToggle').addEventListener('click', () => setPref('language', state.prefs.language === 'ar' ? 'en' : 'ar'));

  if (profile.setupComplete) {
    state.view = 'home';
  } else {
    state.view = 'wizard';
    state.wizard = { step: profile.setupStep || 0, drafts: {} };
  }
  connectPrices();
  render();
}

init().catch((e) => {
  $('#view').innerHTML = `<div class="card empty">${t('Could not load')}: ${esc(e.message)}</div>`;
});
</script>
